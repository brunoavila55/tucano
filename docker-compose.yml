services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: tucano
      POSTGRES_USER: tucano
      POSTGRES_PASSWORD: tucano
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tucano"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - .:/app
      - /app/.venv
      - static_data:/app/staticfiles
      - media_data:/app/media
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  worker:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
      - /app/.venv
      - media_data:/app/media
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A config beat -l info
    volumes:
      - .:/app
      - /app/.venv
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    # Portas 80/443 do host livres na VPS de produção; em dev local, mapeadas
    # para 8080/8443 para não colidir com outros projetos na mesma máquina.
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile
      - static_data:/srv/static
      - media_data:/srv/media
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  static_data:
  media_data:
  caddy_data:
  caddy_config:
