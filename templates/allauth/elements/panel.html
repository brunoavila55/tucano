{% load allauth %}
<section class="card p-4 mb-4">
    <h2 class="text-base font-bold text-ink mb-2">{% slot title %}{% endslot %}</h2>
    {% slot body %}{% endslot %}
    {% if slots.actions %}
        <ul class="mt-3 flex flex-wrap gap-3 text-sm">
            {% for action in slots.actions %}<li>{{ action }}</li>{% endfor %}
        </ul>
    {% endif %}
</section>
