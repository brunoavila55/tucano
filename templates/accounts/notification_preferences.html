{% extends "base.html" %}

{% block title %}Notificações — Tucano{% endblock %}

{% block content %}
<h1 class="text-2xl font-extrabold tracking-tight mb-5 inline-flex items-center gap-2">
    {% include "_includes/icon.html" with name="bell" %}Notificações
</h1>
<form method="post" class="card p-5 space-y-4 max-w-sm">
    {% csrf_token %}
    <div class="flex items-center gap-2">
        {{ form.push_enabled }}
        <label for="{{ form.push_enabled.id_for_label }}" class="text-sm font-medium">Notificações push</label>
    </div>
    <div class="flex items-center gap-2">
        {{ form.whatsapp_enabled }}
        <label for="{{ form.whatsapp_enabled.id_for_label }}" class="text-sm font-medium">WhatsApp/SMS (reforço para chamados urgentes)</label>
    </div>
    <div class="flex items-center gap-2">
        {{ form.email_enabled }}
        <label for="{{ form.email_enabled.id_for_label }}" class="text-sm font-medium">E-mail</label>
    </div>
    <button type="submit" class="btn btn-primary">
        <span class="btn-label">Salvar</span>
    </button>
</form>
{% endblock %}
