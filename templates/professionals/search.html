{% extends "base.html" %}

{% block title %}Buscar profissionais — Tucano{% endblock %}

{% block content %}
<h1 class="text-xl font-semibold mb-4">Buscar profissionais</h1>

<form hx-get="{% url 'professionals:search' %}" hx-target="#results" hx-push-url="true" class="space-y-3 mb-6">
    <div>
        <label class="block text-sm font-medium mb-1" for="categoria">Categoria</label>
        <select name="categoria" id="categoria" class="border rounded px-2 py-1 w-full max-w-xs">
            <option value="">Todas</option>
            {% for c in categories %}
                <option value="{{ c.slug }}" {% if c.slug == selected_category %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select>
    </div>
    <input type="hidden" name="lat" id="search-lat" value="{{ lat }}">
    <input type="hidden" name="lon" id="search-lon" value="{{ lon }}">
    <div class="flex items-center gap-3">
        <button type="button" id="use-location-search" class="text-sm underline">Usar minha localização</button>
        <button type="submit" class="rounded bg-gray-900 text-white px-4 py-2 text-sm font-medium">Buscar</button>
    </div>
</form>

<div id="results">
    {% include "professionals/_search_results.html" %}
</div>

<script>
    document.getElementById("use-location-search").addEventListener("click", function () {
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition(function (position) {
            document.getElementById("search-lat").value = position.coords.latitude;
            document.getElementById("search-lon").value = position.coords.longitude;
        });
    });
</script>
{% endblock %}
