{% extends "base.html" %}

{% block title %}Buscar profissionais — Tucano{% endblock %}

{% block content %}
<h1 class="text-2xl font-extrabold tracking-tight mb-5">Buscar profissionais</h1>

<form hx-get="{% url 'professionals:search' %}" hx-target="#results" hx-push-url="true" hx-indicator="#search-spinner" class="card p-4 mb-6 flex flex-wrap items-end gap-4">
    <div class="min-w-[12rem]">
        <label class="field-label" for="categoria">Categoria</label>
        <select name="categoria" id="categoria">
            <option value="">Todas</option>
            {% for c in categories %}
                <option value="{{ c.slug }}" {% if c.slug == selected_category %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select>
    </div>
    <input type="hidden" name="lat" id="search-lat" value="{{ lat }}">
    <input type="hidden" name="lon" id="search-lon" value="{{ lon }}">
    <div class="flex items-center gap-4">
        <button type="button" id="use-location-search" class="link text-sm inline-flex items-center gap-1.5">
            {% include "_includes/icon.html" with name="pin" %}Usar minha localização
        </button>
        <button type="submit" class="btn btn-primary">
            {% include "_includes/icon.html" with name="search" %}
            <span class="btn-label">Buscar</span>
            <span id="search-spinner" class="htmx-indicator spinner"></span>
        </button>
    </div>
</form>

<div id="results">
    {% include "professionals/_search_results.html" %}
</div>

<script>
    document.getElementById("use-location-search").addEventListener("click", function () {
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition(function (position) {
            document.getElementById("search-lat").value = position.coords.latitude;
            document.getElementById("search-lon").value = position.coords.longitude;
        });
    });
</script>
{% endblock %}
