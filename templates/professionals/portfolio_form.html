{% extends "base.html" %}

{% block title %}Adicionar foto ao portfólio — Tucano{% endblock %}

{% block content %}
<h1 class="text-xl font-semibold mb-4">Adicionar foto ao portfólio</h1>
<form method="post" enctype="multipart/form-data" class="space-y-4 max-w-sm">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div>
        <label class="block text-sm font-medium mb-1" for="{{ form.image.id_for_label }}">Foto</label>
        {{ form.image }}
        {{ form.image.errors }}
    </div>
    <div>
        <label class="block text-sm font-medium mb-1" for="{{ form.caption.id_for_label }}">Legenda (opcional)</label>
        {{ form.caption }}
    </div>
    <button type="submit" class="rounded bg-gray-900 text-white px-4 py-2 text-sm font-medium">Salvar</button>
</form>
{% endblock %}
