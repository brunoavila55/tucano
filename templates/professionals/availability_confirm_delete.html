{% extends "base.html" %}

{% block title %}Excluir disponibilidade — Tucano{% endblock %}

{% block content %}
<h1 class="text-xl font-semibold mb-4">Excluir "{{ object }}"?</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="rounded bg-red-600 text-white px-4 py-2 text-sm font-medium">Confirmar exclusão</button>
    <a href="{% url 'professionals:dashboard' %}" class="ml-3 text-sm underline">Cancelar</a>
</form>
{% endblock %}
