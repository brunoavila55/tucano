{% extends "base.html" %}

{% block title %}Excluir disponibilidade — Tucano{% endblock %}

{% block content %}
<h1 class="text-xl font-extrabold tracking-tight mb-4">Excluir "{{ object }}"?</h1>
<form method="post" class="flex items-center gap-4">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger-solid">
        {% include "_includes/icon.html" with name="trash" %}
        <span class="btn-label">Confirmar exclusão</span>
    </button>
    <a href="{% url 'professionals:dashboard' %}" class="link text-sm">Cancelar</a>
</form>
{% endblock %}
