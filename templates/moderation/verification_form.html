{% extends "base.html" %}

{% block title %}Solicitar verificação — Tucano{% endblock %}

{% block content %}
<h1 class="text-xl font-semibold mb-4">Solicitar verificação de identidade</h1>
<form method="post" enctype="multipart/form-data" class="space-y-4 max-w-sm">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div>
        <label class="block text-sm font-medium mb-1" for="{{ form.document.id_for_label }}">Documento</label>
        {{ form.document }}
        {{ form.document.errors }}
    </div>
    <div class="flex items-start gap-2">
        {{ form.consent }}
        <label class="text-sm" for="{{ form.consent.id_for_label }}">{{ form.consent.label }}</label>
    </div>
    <button type="submit" class="rounded bg-gray-900 text-white px-4 py-2 text-sm font-medium">Enviar</button>
</form>
{% endblock %}
